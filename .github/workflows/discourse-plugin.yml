name: Discourse Projects Plugin

on:
  push:

permissions:
  contents: write

jobs:
  ci:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      core_ref: v2026.7.3
      # Pin the Ruby 3.4 test image: slim moved to Ruby 4, which v2026.7.x can't install on.
      container: discourse/discourse_test:slim-browsers@sha256:2da24a18bb34116edf6b5ce62da87740805dc2ed02a3a9d6194d38da1400bbe2

  bump:
    needs: ci 
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Automated version bump
        uses: phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: 'v'
          commit-message: 'build(release): bumps version to {{version}} [skip ci]'
